name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: securecode_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_only_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test_user -d securecode_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test_user:test_only_password@localhost:5432/securecode_test
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - run: pip-audit -r requirements.txt
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      API_KEY: ci-workspace-key-not-for-use-123456
      POSTGRES_PORT: 55432
      BACKEND_PORT: 58000
      FRONTEND_PORT: 53000
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: |
          set -euo pipefail
          trap 'docker compose down -v --remove-orphans' EXIT
          docker compose up -d
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:58000/api/live
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:58000/api/health
          curl --fail --retry 5 --retry-delay 1 --retry-all-errors \
            -H "Authorization: Bearer ${API_KEY}" http://127.0.0.1:58000/api/workspace
